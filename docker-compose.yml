services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tasks
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/tasks
    depends_on:
      - postgres

volumes:
  postgres_data: